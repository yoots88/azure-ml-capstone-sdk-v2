$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: capstone-fda-retrospective-smoke
compute: azureml:cpu-cluster
code: ../src
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../environment/conda_sweep.yaml
command: >-
  python train.py --mode capstone-trial
  --train "${{inputs.train}}" --validation "${{inputs.validation}}"
  --model "${{outputs.model}}" --depth ${{inputs.depth}} --trees ${{inputs.trees}}
  --rate ${{inputs.rate}} --smote ${{inputs.smote}} --weight ${{inputs.weight}}
  --row-fraction ${{inputs.row_fraction}} --column-fraction ${{inputs.column_fraction}}
inputs:
  train:
    type: mltable
    path: azureml:fda-retrospective-train:5
    mode: download
  validation:
    type: mltable
    path: azureml:fda-retrospective-validation:5
    mode: download
  depth: 4
  trees: 30
  rate: 0.1
  smote: 0.7
  weight: 1.0
  row_fraction: 0.8
  column_fraction: 0.8
outputs:
  model:
    type: uri_folder
    mode: upload
