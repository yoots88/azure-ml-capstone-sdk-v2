name: capstone-fda-sweep
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - pandas==2.2.3
      - openpyxl==3.1.5
      - pyarrow==15.0.2
      - scikit-learn==1.5.2
      - imbalanced-learn==0.12.4
      - xgboost==2.1.4
      # MLflow 2.15.1 imports pkg_resources, removed in setuptools 82.
      - setuptools==80.9.0
      # Azure ML plugin 1.59.0 caps mlflow-skinny at 2.15.1.
      - mlflow==2.15.1
      - azureml-mlflow==1.59.0
